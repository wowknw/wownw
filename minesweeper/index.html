<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>지뢰찾기</title>
<style>
  :root {
    --bg: #f3f4f6;
    --panel: #ffffff;
    --text: #1f2937;
    --muted: #6b7280;
    --cell: #cbd5e1;
    --cell-hover: #b6c2d1;
    --open: #f8fafc;
    --border: #94a3b8;
    --accent: #2563eb;
    --boom: #ef4444;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #111827;
      --panel: #1f2937;
      --text: #f3f4f6;
      --muted: #9ca3af;
      --cell: #475569;
      --cell-hover: #556479;
      --open: #273244;
      --border: #334155;
      --accent: #60a5fa;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 24px 16px;
  }
  h1 { margin: 0 0 16px; font-size: 1.6rem; }
  .controls {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    justify-content: center;
    margin-bottom: 12px;
  }
  button {
    font: inherit;
    border: 1px solid var(--border);
    background: var(--panel);
    color: var(--text);
    padding: 6px 12px;
    border-radius: 8px;
    cursor: pointer;
  }
  button.active { background: var(--accent); border-color: var(--accent); color: #fff; }
  .status {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 8px 14px;
    margin-bottom: 12px;
    min-width: 260px;
  }
  .counter { font-variant-numeric: tabular-nums; font-weight: 700; font-size: 1.2rem; min-width: 64px; }
  .counter.right { text-align: right; }
  #face { font-size: 1.5rem; padding: 2px 10px; line-height: 1.2; }
  .board-wrap { max-width: 100%; overflow-x: auto; padding-bottom: 4px; }
  #board {
    display: grid;
    gap: 2px;
    background: var(--border);
    border: 2px solid var(--border);
    border-radius: 6px;
    user-select: none;
    -webkit-user-select: none;
    touch-action: manipulation;
  }
  .cell {
    width: var(--size, 30px);
    height: var(--size, 30px);
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--cell);
    font-weight: 800;
    font-size: calc(var(--size, 30px) * 0.55);
    cursor: pointer;
    border-radius: 3px;
  }
  .cell:not(.open):hover { background: var(--cell-hover); }
  .cell.open { background: var(--open); cursor: default; }
  .cell.boom { background: var(--boom); }
  .cell.wrong { background: #fca5a5; }
  .n1 { color: #2563eb; } .n2 { color: #16a34a; } .n3 { color: #dc2626; }
  .n4 { color: #7c3aed; } .n5 { color: #b45309; } .n6 { color: #0891b2; }
  .n7 { color: #374151; } .n8 { color: #6b7280; }
  @media (prefers-color-scheme: dark) {
    .n1 { color: #60a5fa; } .n2 { color: #4ade80; } .n3 { color: #f87171; }
    .n4 { color: #c084fc; } .n5 { color: #fbbf24; } .n6 { color: #22d3ee; }
    .n7 { color: #e5e7eb; } .n8 { color: #9ca3af; }
  }
  #message { min-height: 1.5em; margin: 12px 0 4px; font-weight: 600; }
  .help { color: var(--muted); font-size: 0.9rem; text-align: center; max-width: 520px; line-height: 1.5; }
</style>
</head>
<body>
  <h1>💣 지뢰찾기</h1>

  <div class="controls" id="levels">
    <button data-level="beginner" class="active">초급 (9×9, 10)</button>
    <button data-level="intermediate">중급 (16×16, 40)</button>
    <button data-level="expert">고급 (30×16, 99)</button>
  </div>

  <div class="status">
    <span class="counter" id="mines" title="남은 지뢰">💣 0</span>
    <button id="face" title="새 게임">🙂</button>
    <span class="counter right" id="timer" title="경과 시간">⏱ 0</span>
  </div>

  <div class="controls">
    <button id="flagMode" title="모바일에서 깃발 꽂기 모드">🚩 깃발 모드: 끔</button>
  </div>

  <div class="board-wrap"><div id="board"></div></div>
  <div id="message"></div>
  <p class="help">
    클릭: 칸 열기 · 우클릭(또는 길게 누르기): 깃발 🚩 → 물음표 ❓ → 해제<br>
    숫자 칸 클릭: 주변 깃발 수가 숫자와 같으면 나머지 칸을 한 번에 엽니다.<br>
    첫 클릭은 항상 안전합니다.
  </p>

<script>
(() => {
  const LEVELS = {
    beginner:     { rows: 9,  cols: 9,  mines: 10 },
    intermediate: { rows: 16, cols: 16, mines: 40 },
    expert:       { rows: 16, cols: 30, mines: 99 },
  };

  const boardEl = document.getElementById('board');
  const minesEl = document.getElementById('mines');
  const timerEl = document.getElementById('timer');
  const faceEl = document.getElementById('face');
  const messageEl = document.getElementById('message');
  const flagModeEl = document.getElementById('flagMode');

  let level = 'beginner';
  let rows, cols, mineCount;
  let cells = [];        // { mine, open, mark: 0 none | 1 flag | 2 question, adj, el }
  let started, over, opened, flags;
  let timer = null, seconds = 0;
  let flagMode = false;

  const idx = (r, c) => r * cols + c;

  function neighbors(i) {
    const r = Math.floor(i / cols), c = i % cols, out = [];
    for (let dr = -1; dr <= 1; dr++) {
      for (let dc = -1; dc <= 1; dc++) {
        if (!dr && !dc) continue;
        const nr = r + dr, nc = c + dc;
        if (nr >= 0 && nr < rows && nc >= 0 && nc < cols) out.push(idx(nr, nc));
      }
    }
    return out;
  }

  function newGame() {
    ({ rows, cols, mines: mineCount } = LEVELS[level]);
    started = false; over = false; opened = 0; flags = 0;
    stopTimer(); seconds = 0;

    const size = Math.max(22, Math.min(32, Math.floor((window.innerWidth - 40) / cols) - 2));
    boardEl.style.setProperty('--size', size + 'px');
    boardEl.style.gridTemplateColumns = `repeat(${cols}, ${size}px)`;
    boardEl.innerHTML = '';
    cells = [];
    for (let i = 0; i < rows * cols; i++) {
      const el = document.createElement('div');
      el.className = 'cell';
      el.dataset.i = i;
      boardEl.appendChild(el);
      cells.push({ mine: false, open: false, mark: 0, adj: 0, el });
    }
    faceEl.textContent = '🙂';
    messageEl.textContent = '';
    updateCounters();
  }

  // Mines are placed after the first click, keeping the clicked cell and its neighbors clear.
  function placeMines(safe) {
    const forbidden = new Set([safe, ...neighbors(safe)]);
    const candidates = [];
    for (let i = 0; i < cells.length; i++) if (!forbidden.has(i)) candidates.push(i);
    // Fall back to keeping only the clicked cell safe if the board is too dense.
    const pool = candidates.length >= mineCount
      ? candidates
      : cells.map((_, i) => i).filter(i => i !== safe);
    for (let k = 0; k < mineCount; k++) {
      const j = k + Math.floor(Math.random() * (pool.length - k));
      [pool[k], pool[j]] = [pool[j], pool[k]];
      cells[pool[k]].mine = true;
    }
    cells.forEach((cell, i) => {
      cell.adj = neighbors(i).filter(n => cells[n].mine).length;
    });
  }

  function startTimer() {
    timer = setInterval(() => {
      seconds = Math.min(999, seconds + 1);
      updateCounters();
    }, 1000);
  }
  function stopTimer() { clearInterval(timer); timer = null; }

  function updateCounters() {
    minesEl.textContent = '💣 ' + (mineCount - flags);
    timerEl.textContent = '⏱ ' + seconds;
  }

  function render(i) {
    const cell = cells[i], el = cell.el;
    el.className = 'cell';
    el.textContent = '';
    if (cell.open) {
      el.classList.add('open');
      if (cell.mine) el.textContent = '💣';
      else if (cell.adj) { el.textContent = cell.adj; el.classList.add('n' + cell.adj); }
    } else if (cell.mark === 1) {
      el.textContent = '🚩';
    } else if (cell.mark === 2) {
      el.textContent = '❓';
    }
  }

  function reveal(i) {
    if (over) return;
    const cell = cells[i];
    if (cell.open || cell.mark === 1) return;

    if (!started) {
      started = true;
      placeMines(i);
      startTimer();
    }

    if (cell.mine) return lose(i);

    // Iterative flood fill from empty cells.
    const stack = [i];
    while (stack.length) {
      const j = stack.pop();
      const c = cells[j];
      if (c.open || c.mark === 1) continue;
      if (c.mark === 2) c.mark = 0;
      c.open = true;
      opened++;
      render(j);
      if (c.adj === 0) for (const n of neighbors(j)) if (!cells[n].open) stack.push(n);
    }
    checkWin();
  }

  // Clicking an opened number with matching flags opens the remaining neighbors.
  function chord(i) {
    const cell = cells[i];
    if (!cell.open || !cell.adj) return;
    const around = neighbors(i);
    const flagged = around.filter(n => cells[n].mark === 1).length;
    if (flagged !== cell.adj) return;
    for (const n of around) {
      if (over) return;
      if (!cells[n].open && cells[n].mark !== 1) reveal(n);
    }
  }

  function toggleMark(i) {
    if (over) return;
    const cell = cells[i];
    if (cell.open) return;
    if (cell.mark === 1) flags--;
    cell.mark = (cell.mark + 1) % 3;
    if (cell.mark === 1) flags++;
    render(i);
    updateCounters();
  }

  function lose(i) {
    over = true;
    stopTimer();
    cells.forEach((cell, j) => {
      if (cell.mine && cell.mark !== 1) { cell.open = true; render(j); }
      else if (!cell.mine && cell.mark === 1) { cell.el.classList.add('wrong'); cell.el.textContent = '❌'; }
    });
    cells[i].el.classList.add('boom');
    faceEl.textContent = '😵';
    messageEl.textContent = '펑! 지뢰를 밟았습니다. 😢';
  }

  function checkWin() {
    if (over || opened !== rows * cols - mineCount) return;
    over = true;
    stopTimer();
    cells.forEach((cell, j) => {
      if (cell.mine && cell.mark !== 1) { cell.mark = 1; render(j); }
    });
    flags = mineCount;
    updateCounters();
    faceEl.textContent = '😎';
    messageEl.textContent = `승리! ${seconds}초 만에 모든 지뢰를 찾았습니다. 🎉`;
  }

  function primary(i) {
    if (flagMode && !cells[i].open) return toggleMark(i);
    if (cells[i].open) chord(i); else reveal(i);
  }

  // --- input handling ---
  const cellIndex = e => {
    const el = e.target.closest('.cell');
    return el ? Number(el.dataset.i) : null;
  };

  let longPressTimer = null, longPressed = false;

  boardEl.addEventListener('click', e => {
    if (longPressed) { longPressed = false; return; }
    const i = cellIndex(e);
    if (i !== null) primary(i);
  });

  boardEl.addEventListener('contextmenu', e => {
    e.preventDefault();
    const i = cellIndex(e);
    if (i === null || longPressed) return;
    if (cells[i].open) chord(i); else toggleMark(i);
  });

  boardEl.addEventListener('mousedown', e => {
    if (!over && e.button === 0 && cellIndex(e) !== null) faceEl.textContent = '😮';
  });
  window.addEventListener('mouseup', () => { if (!over) faceEl.textContent = '🙂'; });

  boardEl.addEventListener('touchstart', e => {
    const i = cellIndex(e);
    if (i === null) return;
    longPressed = false;
    longPressTimer = setTimeout(() => {
      longPressed = true;
      toggleMark(i);
      if (navigator.vibrate) navigator.vibrate(30);
    }, 400);
  }, { passive: true });
  const cancelLongPress = () => clearTimeout(longPressTimer);
  boardEl.addEventListener('touchend', cancelLongPress);
  boardEl.addEventListener('touchmove', cancelLongPress, { passive: true });

  faceEl.addEventListener('click', newGame);

  flagModeEl.addEventListener('click', () => {
    flagMode = !flagMode;
    flagModeEl.classList.toggle('active', flagMode);
    flagModeEl.textContent = '🚩 깃발 모드: ' + (flagMode ? '켬' : '끔');
  });

  document.getElementById('levels').addEventListener('click', e => {
    const btn = e.target.closest('button[data-level]');
    if (!btn) return;
    level = btn.dataset.level;
    document.querySelectorAll('#levels button').forEach(b => b.classList.toggle('active', b === btn));
    newGame();
  });

  document.addEventListener('keydown', e => {
    if (e.key === 'F2' || e.key === 'r' || e.key === 'R') newGame();
  });

  newGame();
})();
</script>
</body>
</html>
